# SPDX-License-Identifier: GPL-3.0-or-later
# Publishes site/ (home page + privacy policy) to https://ukpratik.github.io/lantern-sudoku/ (ADR-009).
# Manual only until release: Pages needs the repo public, which is a user decision at 1.0. Then add
#   push: { branches: [main], paths: ["site/**", ".github/workflows/pages.yml"] }
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
